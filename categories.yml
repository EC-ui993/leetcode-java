# ============================================================================
# 分类与标签的唯一真相源
#
# 本文件被 tools/new-problem.mjs 与 tools/build-index.mjs 读取并强校验。
# 违反白名单的标签会被拒绝写入，这是防止索引腐烂的第一道闸门。
#
# 规则：
#   1. 分类编号一经分配【永不重排】，新分类一律追加 19-、20-……
#      重排会让 git 历史塞满 rename，破坏 git log --follow 的连续性。
#   2. 近义标签只保留一个。新增前先检索词表里有没有「其实是同一个意思」的项。
#   3. 标签与分类同名是允许的、且有意为之：标签用于标记题目的【次要技巧】，
#      使一道题能在多个维度被检索到。但分类名不会自动继承为标签。
#   4. 标签总数控制在 60 个上下。超过说明粒度失控，应删低频标签或升格为分类。
# ============================================================================

